<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Roguelike</title>
  <link rel="stylesheet" href="pixel-ui.css?v=20260720-02">
</head>
<body>
  <div class="device-shell">
    <div class="app-shell pixel-ui">
      <header class="app-header">
        <div class="header-top">
          <div class="header-brand">
            <span class="header-brand-mark" aria-hidden="true">FR</span>
            <div>
              <p class="eyebrow">Finance Roguelike</p>
              <h1>Current Run</h1>
            </div>
          </div>
          <button id="new-run-button" class="icon-button">Reset</button>
        </div>

        <div class="run-bar">
          <div>
            <p id="turn-label" class="run-title"></p>
            <p id="status-hint" class="run-subtitle"></p>
          </div>
          <button id="next-turn-button" class="primary-button" disabled>Next Turn</button>
        </div>

        <div id="turn-guide" class="turn-guide"></div>
        <div id="stats-grid" class="stats-grid"></div>
      </header>

      <main id="tab-content" class="tab-content"></main>

      <nav id="bottom-nav" class="bottom-nav" hidden></nav>
    </div>
  </div>

  <script type="module" src="app.js?v=20260720-02"></script>
</body>
</html>
